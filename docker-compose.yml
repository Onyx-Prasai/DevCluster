version: '3.8'

services:
  devcluster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devcluster-app
    environment:
      - GITHUB_API_TOKEN=${GITHUB_API_TOKEN}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./notebooks:/app/notebooks
    working_dir: /app
    command: python main.py
